<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" fill="none">
  <defs>
    <!-- Background Gradient for Mark -->
    <linearGradient id="markBgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Spectrum Wave Gradient -->
    <linearGradient id="waveGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Studio Accent Gradient Light -->
    <linearGradient id="studioTextGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="nodeGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== LEFT LOGOMARK EMBLEM ==================== -->
  <g transform="translate(24, 28)">
    <!-- Squircle Background -->
    <rect width="144" height="144" rx="34" fill="url(#markBgGradLight)" />
    <!-- Specular Highlight Border -->
    <rect x="1.5" y="1.5" width="141" height="141" rx="32.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

    <!-- Equalizer Spectrum Bars -->
    <g opacity="0.88">
      <rect x="31" y="76" width="6.5" height="18" rx="3.2" fill="url(#waveGradLight)" />
      <rect x="43" y="66" width="6.5" height="38" rx="3.2" fill="url(#waveGradLight)" />
      <rect x="55" y="55" width="6.5" height="58" rx="3.2" fill="url(#waveGradLight)" />
      <rect x="69" y="48" width="6.5" height="72" rx="3.2" fill="url(#waveGradLight)" />
      <rect x="83" y="55" width="6.5" height="58" rx="3.2" fill="url(#waveGradLight)" />
      <rect x="95" y="66" width="6.5" height="38" rx="3.2" fill="url(#waveGradLight)" />
      <rect x="107" y="76" width="6.5" height="18" rx="3.2" fill="url(#waveGradLight)" />
    </g>

    <!-- Tuning Fork / ExpVoice Crest -->
    <g filter="url(#softGlowLight)" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="50" y1="38" x2="72" y2="64" />
      <line x1="94" y1="38" x2="72" y2="64" />
      <line x1="72" y1="64" x2="72" y2="108" />
    </g>
    <!-- Jewel Nodes -->
    <circle cx="50" cy="38" r="4.2" fill="#ffffff" />
    <circle cx="94" cy="38" r="4.2" fill="#ffffff" />
    <circle cx="72" cy="108" r="4.2" fill="#ffffff" />
    <circle cx="72" cy="64" r="5.8" fill="url(#nodeGradLight)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- ==================== RIGHT BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(196, 0)">
    <!-- Overline Badge & Yamaha Wordmark -->
    <g transform="translate(0, 56)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="3.2" fill="#4338ca">
        YAMAHA EXPANSION AUDIO ENGINE
      </text>
    </g>

    <!-- Main Title: ExpVoice Studio -->
    <g transform="translate(0, 114)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
        ExpVoice <tspan fill="url(#studioTextGradLight)">Studio</tspan>
      </text>
    </g>

    <!-- Subtitle & Capabilities Tagline -->
    <g transform="translate(0, 154)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.2" fill="#475569">
        PPI • PPF • YEP FILE CONVERTER
      </text>

      <!-- Precision Pill Badge -->
      <g transform="translate(290, -13)">
        <rect width="64" height="20" rx="6" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1" />
        <text x="32" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" fill="#3730a3">
          v2.5 PRO
        </text>
      </g>
    </g>
  </g>
</svg>