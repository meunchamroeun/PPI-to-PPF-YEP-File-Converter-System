<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Music Sound Waves & Synthesizer Bars -->
  <g transform="translate(56, 120)" filter="url(#glow)">
    <!-- Center Wave Lines -->
    <rect x="30" y="110" width="24" height="80" rx="12" fill="url(#waveGrad)" />
    <rect x="75" y="60" width="24" height="180" rx="12" fill="url(#waveGrad)" />
    <rect x="120" y="20" width="24" height="260" rx="12" fill="url(#waveGrad)" />
    <rect x="165" y="80" width="24" height="140" rx="12" fill="url(#waveGrad)" />
    <rect x="210" y="120" width="24" height="60" rx="12" fill="url(#waveGrad)" />
    <rect x="255" y="40" width="24" height="220" rx="12" fill="url(#waveGrad)" />
    <rect x="300" y="90" width="24" height="120" rx="12" fill="url(#waveGrad)" />
    <rect x="345" y="130" width="24" height="40" rx="12" fill="url(#waveGrad)" />
  </g>

  <!-- Modern Audio Note Emblem -->
  <path d="M350 360 C320 360 300 375 300 395 C300 415 320 430 345 430 C370 430 390 415 390 390 L390 280 L440 260 L440 310" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>