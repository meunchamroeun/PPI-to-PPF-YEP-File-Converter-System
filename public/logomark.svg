<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Spectrum Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" />

  <!-- Inner Specular Border Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />

  <!-- Audio Equalizer Bars (Behind Yamaha Emblem) -->
  <g opacity="0.85">
    <rect x="110" y="270" width="22" height="60" rx="11" fill="url(#waveGrad)" />
    <rect x="150" y="235" width="22" height="130" rx="11" fill="url(#waveGrad)" />
    <rect x="190" y="200" width="22" height="200" rx="11" fill="url(#waveGrad)" />
    <rect x="245" y="175" width="22" height="250" rx="11" fill="url(#waveGrad)" />
    <rect x="300" y="200" width="22" height="200" rx="11" fill="url(#waveGrad)" />
    <rect x="340" y="235" width="22" height="130" rx="11" fill="url(#waveGrad)" />
    <rect x="380" y="270" width="22" height="60" rx="11" fill="url(#waveGrad)" />
  </g>

  <!-- Precision Yamaha Tuning Fork / ExpVoice "Y" Crest -->
  <g filter="url(#softGlow)" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <line x1="176" y1="130" x2="256" y2="225" />
    <line x1="336" y1="130" x2="256" y2="225" />
    <line x1="256" y1="225" x2="256" y2="385" />
  </g>

  <!-- Terminal Jewel Nodes -->
  <circle cx="176" cy="130" r="13" fill="#ffffff" />
  <circle cx="336" cy="130" r="13" fill="#ffffff" />
  <circle cx="256" cy="385" r="13" fill="#ffffff" />

  <!-- Center Jewel Prism Node -->
  <circle cx="256" cy="225" r="19" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="4" />
</svg>