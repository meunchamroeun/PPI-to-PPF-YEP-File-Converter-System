<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" fill="none">
  <style>
    .mark-bg { fill: url(#markBgLight); }
    .mark-border { stroke: rgba(255,255,255,0.25); }
    .overline-text { fill: #4338ca; }
    .main-title { fill: #0f172a; }
    .studio-text { fill: url(#studioGradLight); }
    .subtitle-text { fill: #475569; }
    .badge-bg { fill: #e0e7ff; stroke: #c7d2fe; }
    .badge-text { fill: #3730a3; }

    @media (prefers-color-scheme: dark) {
      .mark-bg { fill: url(#markBgDark); }
      .mark-border { stroke: rgba(255,255,255,0.18); }
      .overline-text { fill: #38bdf8; }
      .main-title { fill: #ffffff; }
      .studio-text { fill: url(#studioGradDark); }
      .subtitle-text { fill: #94a3b8; }
      .badge-bg { fill: #1e293b; stroke: #334155; }
      .badge-text { fill: #a5b4fc; }
    }
  </style>

  <defs>
    <!-- Mark Background Gradient Dark -->
    <linearGradient id="markBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Mark Background Gradient Light -->
    <linearGradient id="markBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Spectrum Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Studio Accent Gradient Light -->
    <linearGradient id="studioGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Studio Accent Gradient Dark -->
    <linearGradient id="studioGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== LEFT LOGOMARK EMBLEM ==================== -->
  <g transform="translate(24, 28)">
    <rect width="144" height="144" rx="34" class="mark-bg" />
    <rect x="1.5" y="1.5" width="141" height="141" rx="32.5" fill="none" class="mark-border" stroke-width="1.5" />

    <!-- Equalizer Spectrum Bars -->
    <g opacity="0.88">
      <rect x="31" y="76" width="6.5" height="18" rx="3.2" fill="url(#waveGrad)" />
      <rect x="43" y="66" width="6.5" height="38" rx="3.2" fill="url(#waveGrad)" />
      <rect x="55" y="55" width="6.5" height="58" rx="3.2" fill="url(#waveGrad)" />
      <rect x="69" y="48" width="6.5" height="72" rx="3.2" fill="url(#waveGrad)" />
      <rect x="83" y="55" width="6.5" height="58" rx="3.2" fill="url(#waveGrad)" />
      <rect x="95" y="66" width="6.5" height="38" rx="3.2" fill="url(#waveGrad)" />
      <rect x="107" y="76" width="6.5" height="18" rx="3.2" fill="url(#waveGrad)" />
    </g>

    <!-- Tuning Fork / ExpVoice Crest -->
    <g filter="url(#softGlow)" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="50" y1="38" x2="72" y2="64" />
      <line x1="94" y1="38" x2="72" y2="64" />
      <line x1="72" y1="64" x2="72" y2="108" />
    </g>
    <circle cx="50" cy="38" r="4.2" fill="#ffffff" />
    <circle cx="94" cy="38" r="4.2" fill="#ffffff" />
    <circle cx="72" cy="108" r="4.2" fill="#ffffff" />
    <circle cx="72" cy="64" r="5.8" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- ==================== RIGHT BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(196, 0)">
    <g transform="translate(0, 56)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="3.2" class="overline-text">
        YAMAHA EXPANSION AUDIO ENGINE
      </text>
    </g>

    <g transform="translate(0, 114)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" class="main-title">
        ExpVoice <tspan class="studio-text">Studio</tspan>
      </text>
    </g>

    <g transform="translate(0, 154)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.2" class="subtitle-text">
        PPI • PPF • YEP FILE CONVERTER
      </text>

      <g transform="translate(290, -13)">
        <rect width="64" height="20" rx="6" class="badge-bg" stroke-width="1" />
        <text x="32" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" class="badge-text">
          v2.5 PRO
        </text>
      </g>
    </g>
  </g>
</svg>